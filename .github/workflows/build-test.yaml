name: Build & Test

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate:
    name: Hassfest validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  hacs:
    name: HACS validate
    runs-on: ubuntu-latest
    steps:
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run ruff
        run: uv run ruff check custom_components/schellenberg_usb/ tests/

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: uv run ruff format --check custom_components/schellenberg_usb/ tests/

      - name: Run mypy
        if: ${{ !cancelled() }}
        run: uv run mypy custom_components/schellenberg_usb/ tests/

      - name: Run codespell
        if: ${{ !cancelled() }}
        run: >-
          uv run codespell
          custom_components/schellenberg_usb/ tests/ README.md CONTRIBUTING.md

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run pytest
        run: uv run pytest